<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ローン計算・画面幅検査（非本番）</title><style>body{font:16px/1.6 system-ui;background:#eceff3;color:#101f35;padding:20px;margin:0}label{display:inline-block;margin:0 16px 14px 0}select{font:inherit;padding:8px}iframe{display:block;background:white;border:2px solid #101f35;height:850px;max-width:none}p{margin:8px 0}</style><h1>ローン計算・画面幅検査</h1><p>PR #2と同一のindex.html。検査用ページは別ブランチのみで、本番へ統合しません。iframe幅は実機ではありません。</p><label>本文幅 <select id="width"><option>375</option><option>390</option><option>959</option><option>960</option><option>1200</option></select> px</label><label>ルート文字サイズ <select id="size"><option value="100">100%</option><option value="200">200%</option></select></label><p>ルート文字サイズ変更はブラウザ全体のズーム・OS文字拡大の代替ではありません。</p><iframe id="screen" title="ローン計算・検査対象" src="./index.html" style="width:375px"></iframe><script>const frame=document.getElementById('screen');const width=document.getElementById('width');const size=document.getElementById('size');function apply(){frame.style.width=width.value+'px';frame.contentDocument.documentElement.style.fontSize=size.value+'%';}width.addEventListener('change',apply);size.addEventListener('change',apply);frame.addEventListener('load',apply);</script></html>
