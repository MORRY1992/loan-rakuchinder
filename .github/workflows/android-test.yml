name: Android test build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify calculations and build shared HTML
        run: npm test && npm run build
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build test APK and unsigned release bundle
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Prepare clearly labelled outputs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/loan-rakuchinder-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/loan-rakuchinder-UNSIGNED.aab
          printf '%s\n' 'Test APK: for device testing only. Ads and billing are not connected.' 'UNSIGNED AAB: not ready for Google Play upload. Release signing and device checks are required.' > build-output/READ-ME.txt
          cd build-output
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: loan-rakuchinder-test-build
          path: build-output/
          if-no-files-found: error
          retention-days: 7
